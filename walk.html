<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<script src="assets/live-directions.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walking directions · JW Atlanta Local Guide</title>
<style>
@page { size: letter; margin: 0 }
:root { --ink:#1d2528; --muted:#5d6b71; --paper:#f6f3ee; --line:#ddd5c9; --gold:#9b7a3c; --wine:#55343c; --sage:#5f7f68 }
* { box-sizing:border-box }
html, body { margin:0 }
body { background:#e9e5de; color:var(--ink); font-family:Inter, Arial, Helvetica, sans-serif; -webkit-print-color-adjust:exact; print-color-adjust:exact }
.toolbar { max-width:8.5in; margin:0 auto; padding:14px 16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center }
.toolbar a, .toolbar button { font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; color:var(--ink); padding:9px 14px; border-radius:999px; cursor:pointer; text-decoration:none }
.toolbar .primary { background:var(--wine); border-color:var(--wine); color:#fff }
.toolbar a:focus-visible, .toolbar button:focus-visible { outline:3px solid var(--gold); outline-offset:2px }
.toolbar .spacer { flex:1 }
.page { width:min(8.5in, 100%); min-height:11in; margin:0 auto 24px; background:#fff; padding:0.4in 0.5in 0.34in; display:flex; flex-direction:column; gap:11px; box-shadow:0 8px 30px rgba(29,37,40,.12) }
header { display:flex; justify-content:space-between; align-items:flex-end; gap:18px; padding-bottom:12px; border-bottom:1px solid var(--line); flex-wrap:wrap }
.eyebrow { font-size:9.5px; letter-spacing:.18em; font-weight:700; color:var(--gold); text-transform:uppercase }
h1 { font-family:Lora, Georgia, serif; font-weight:500; font-size:31px; line-height:1.05; margin:6px 0 4px }
.addr { font-size:11.5px; color:var(--muted) }
.stats { display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; flex:none }
.stat { padding:8px 14px; text-align:center; border-left:1px solid var(--line) }
.stat:first-child { border-left:0 }
.stat b { display:block; font-family:Lora, Georgia, serif; font-size:19px; font-weight:600; color:var(--wine) }
.stat span { font-size:9.5px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase }
.map-wrap { position:relative; width:100%; aspect-ratio:720/507; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:#f1eee8 }
.map { position:absolute; left:0; top:0; width:720px; height:507px; transform-origin:0 0 }
.tiles { position:absolute; inset:0; filter:saturate(.42) contrast(.93) brightness(1.03) sepia(.06) }
.tiles img { position:absolute; width:256px; height:256px; user-select:none }
.map > svg { position:absolute; inset:0; width:720px; height:507px; overflow:visible }
svg .route-casing { fill:none; stroke:#fff; stroke-width:9; stroke-linejoin:round; stroke-linecap:round; opacity:.95 }
svg .route { fill:none; stroke:var(--wine); stroke-width:4.6; stroke-linejoin:round; stroke-linecap:round }
svg .passed { fill:rgba(155,122,60,.16); stroke:var(--gold); stroke-width:1.4 }
svg .passed.park { fill:rgba(95,127,104,.14); stroke:var(--sage) }
svg .dest { fill:rgba(85,52,60,.14); stroke:var(--wine); stroke-width:1.6 }
svg .badge circle { fill:var(--wine); stroke:#fff; stroke-width:2 }
svg .badge text, svg .pin text { fill:#fff; font:700 10.5px Inter, Arial, sans-serif; text-anchor:middle }
svg .pin circle { stroke:#fff; stroke-width:2.5 }
.label { position:absolute; background:rgba(255,255,255,.96); border:1px solid var(--line); border-radius:8px; padding:5px 8px; line-height:1.25; box-shadow:0 2px 8px rgba(29,37,40,.12); white-space:nowrap; font-size:10px }
.label b { display:block; font-size:10.5px }
.label.callout { display:flex; gap:6px; align-items:center; border-left:3px solid var(--gold); padding:4px 8px 4px 7px; white-space:normal; width:172px; font-size:8.6px; color:var(--muted) }
.label.callout.park { border-left-color:var(--sage) }
.label.callout b { color:var(--ink); font-size:9.6px }
.label.callout svg { width:17px; height:17px; flex:none; fill:var(--gold); background:#f3ecdf; border-radius:50%; padding:3px }
.label.callout.park svg { fill:var(--sage); background:#e8efe9 }
.attrib { position:absolute; right:6px; bottom:5px; background:rgba(255,255,255,.88); font-size:8px; padding:2px 5px; border-radius:4px; color:var(--muted) }
.legend { position:absolute; left:8px; bottom:8px; background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:8px; padding:5px 8px; font-size:9px; display:flex; gap:10px; align-items:center }
.legend i { display:inline-block; vertical-align:middle; margin-right:4px }
.lg-route { width:20px; height:4px; border-radius:2px; background:var(--wine) }
.lg-badge { width:11px; height:11px; border-radius:50% !important; background:var(--wine) }
.lg-pass { width:12px; height:9px; background:rgba(155,122,60,.25); border:1px solid var(--gold) }
.body { display:grid; grid-template-columns:1fr 2.05in; gap:22px }
h2 { font-family:Lora, Georgia, serif; font-weight:500; font-size:17px; margin:0 0 8px }
ol { list-style:none; margin:0; padding:0 }
li { display:grid; grid-template-columns:22px 1fr auto; gap:9px; align-items:start; padding:4.6px 0; border-top:1px solid #eee7dc; font-size:10.9px; line-height:1.35 }
li:first-child { border-top:0 }
.num { width:20px; height:20px; border-radius:50%; background:var(--wine); color:#fff; font-weight:700; font-size:10px; display:grid; place-items:center; margin-top:1px }
li.arrive .num { background:var(--gold) }
li p { margin:0 }
.pass { display:inline-block; color:var(--gold); font-size:9.8px; font-weight:600; margin:1px 12px 0 0 }
.pass::before { content:"◆ "; font-size:7px; vertical-align:1px }
.dist { color:var(--muted); font-size:10.5px; white-space:nowrap; padding-top:1px }
aside { background:var(--paper); border-radius:12px; padding:13px 14px; font-size:10.5px; line-height:1.45; align-self:start }
aside h3 { font-family:Lora, Georgia, serif; font-weight:500; font-size:14px; margin:0 0 6px }
aside p { margin:0 0 8px } aside p:last-child { margin:0 }
aside .k { display:block; font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:1px }
footer { margin-top:auto; display:flex; justify-content:space-between; gap:16px; font-size:8.5px; color:var(--muted); border-top:1px solid var(--line); padding-top:7px }
.message { padding:28px; background:var(--paper); border-radius:12px; font-size:14px; line-height:1.5 }
@media (max-width:640px) {
  .page { padding:20px 16px; min-height:0; box-shadow:none }
  .body { grid-template-columns:1fr }
  h1 { font-size:26px }
  li { font-size:13px } .pass { font-size:12px } .dist { font-size:12px }
  aside { font-size:13px }
  .label { font-size:11px }
}
@media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto !important } }
@media print {
  body { background:#fff }
  .toolbar { display:none }
  .page { width:8.5in; height:11in; min-height:0; margin:0; box-shadow:none; overflow:hidden }
  .body { grid-template-columns:1fr 2.05in }
}
</style>
</head>
<body>
<nav class="toolbar" aria-label="Card actions">
  <a href="./">← Back to guide</a>
  <span class="spacer"></span>
  <a id="gmaps" href="#" target="_blank" rel="noopener">Open in Google Maps</a>
  <button id="print" class="primary" type="button">Print directions</button>
</nav>
<main class="page" id="page" aria-live="polite"><p class="message">Loading walking directions…</p></main>

<script type="module">
import { cumulative, pointAt, project } from "./scripts/lib/geo.mjs";

const MAP_W = 720, MAP_H = 507, TILE = 256;
const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const page = document.getElementById("page");
const params = new URLSearchParams(location.search);
const id = params.get("id");

const ICONS = {
  park: '<circle cx="12" cy="9" r="5.5"/><rect x="11" y="13" width="2" height="7"/>',
  building: '<path d="M5 20V4h14v16h-5v-4h-4v4zm3-13v2h2V7zm4 0v2h2V7zm-4 4v2h2v-2zm4 0v2h2v-2z"/>',
};

function distanceText(m) {
  const ft = m * 3.28084;
  return ft < 1000 ? `${Math.max(50, Math.round(ft / 50) * 50)} ft` : `${(m / 1609.34).toFixed(1)} mi`;
}
const hotelAddress = (h) => `${h.address.street}, ${h.address.locality}, ${h.address.region} ${h.address.postalCode}`;
function setLiveLink(from, to) {
  const live = window.liveDirections(from, to);
  const a = document.getElementById("gmaps");
  a.href = live.url; a.textContent = `Open in ${live.app}`;
  return live;
}

async function getJson(url) {
  const res = await fetch(url, { cache: "no-cache" });
  if (!res.ok) throw Object.assign(new Error(`${url}: HTTP ${res.status}`), { status: res.status });
  return res.json();
}

function showMessage(html) { page.innerHTML = `<p class="message" role="alert">${html}</p>`; }

/** Pick the most detailed zoom where the route (plus room for labels) fits the map panel. */
function frame(points) {
  for (let z = 18; z >= 13; z--) {
    const px = points.map((p) => project(p, z));
    const xs = px.map((p) => p[0]), ys = px.map((p) => p[1]);
    const w = Math.max(...xs) - Math.min(...xs), h = Math.max(...ys) - Math.min(...ys);
    if (w <= MAP_W * 0.72 && h <= MAP_H * 0.72) {
      const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2;
      return { z, x0: cx - MAP_W / 2, y0: cy - MAP_H / 2 };
    }
  }
  const z = 13, px = points.map((p) => project(p, z));
  return { z, x0: px[0][0] - MAP_W / 2, y0: px[0][1] - MAP_H / 2 };
}

/** Greedy label placement: try spots around each anchor, keep the one that covers the least. */
function placeLabels(labels, obstacles) {
  const placed = [];
  const overlap = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
  for (const lab of labels) {
    let best = null;
    for (const r of [16, 46, 80, 120, 165]) {
      for (let k = 0; k < 16; k++) {
        const ang = (k / 16) * 2 * Math.PI;
        const cx = lab.ax + Math.cos(ang) * (r + lab.w / 2), cy = lab.ay + Math.sin(ang) * (r + lab.h / 2);
        const box = { x: cx - lab.w / 2, y: cy - lab.h / 2, w: lab.w, h: lab.h };
        if (box.x < 4 || box.y < 4 || box.x + box.w > MAP_W - 4 || box.y + box.h > MAP_H - 4) continue;
        let cost = r * 0.6;
        for (const o of obstacles) cost += overlap(box, o) * (o.weight ?? 1);
        for (const p of placed) cost += overlap(box, p) * 50;
        if (!best || cost < best.cost) best = { ...box, cost };
      }
    }
    best ??= { x: Math.min(Math.max(lab.ax, 4), MAP_W - lab.w - 4), y: Math.min(Math.max(lab.ay, 4), MAP_H - lab.h - 4), w: lab.w, h: lab.h };
    placed.push(best);
    lab.box = best;
  }
}

function render({ venue, hotel, route, landmarks }) {
  document.title = `Walking directions · ${venue.name}`;
  const hotelAddr = hotelAddress(hotel);
  setLiveLink(hotelAddr, venue.address);
  const lmById = Object.fromEntries(landmarks.map((l) => [l.id, l]));
  const mi = route.distanceMeters / 1609.34;

  const steps = route.steps.map((s, i) => {
    const last = i === route.steps.length - 1;
    const passing = s.passing.map((p) => `<span class="pass">${esc(lmById[p.landmarkId]?.name ?? p.landmarkId)} on your ${esc(p.side)}</span>`).join("");
    const dist = s.distanceMeters ? `<span class="dist">${distanceText(s.distanceMeters)}</span>` : "";
    return `<li class="${last ? "arrive" : ""}"><span class="num">${i + 1}</span><div><p>${esc(s.instruction)}</p>${passing}</div>${dist}</li>`;
  }).join("");

  const before = [
    `<p><span class="k">Before you go</span>${venue.hours ? esc(venue.hours) : "Hours change. Check current hours before you go."}${venue.phone ? ` · ${esc(venue.phone)}` : ""}</p>`,
    `<p><span class="k">Rather not walk?</span>Ask the front desk to arrange a car or rideshare.</p>`,
    `<p><span class="k">Live directions</span>On your phone, tap “Walking Map” in the guide for turn-by-turn directions.</p>`,
  ].join("");

  page.innerHTML = `
  <header>
    <div>
      <div class="eyebrow">${esc(hotel.name)} · Walking directions</div>
      <h1>${esc(venue.name)}</h1>
      <div class="addr">${esc(venue.address)}</div>
    </div>
    ${route.sameBuilding ? "" : `<div class="stats">
      <div class="stat"><b>${mi < 0.1 ? Math.round(route.distanceMeters * 3.28084) + " ft" : mi.toFixed(1) + " mi"}</b><span>Distance</span></div>
      <div class="stat"><b>~${route.durationMinutes} min</b><span>On foot</span></div></div>`}
  </header>
  ${route.sameBuilding ? "" : `<div class="map-wrap" id="mapWrap"><div class="map" id="map" role="img" aria-label="Map of the walking route from ${esc(hotel.name)} to ${esc(venue.name)}"></div></div>`}
  <div class="body">
    <section><h2>${route.sameBuilding ? "Getting there" : "Step by step"}</h2><ol>${steps}</ol></section>
    <aside><h3>Good to know</h3>${before}</aside>
  </div>
  <footer>
    <span>From ${esc(hotel.name)}, ${esc(hotelAddr)}</span>
    <span>${route.sameBuilding ? "" : `Route calculated ${esc(new Date(route.computedAt + "T12:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }))} from OpenStreetMap. Walking time is an estimate at an average pace.`}</span>
  </footer>`;

  if (!route.sameBuilding) drawMap({ venue, hotel, route, lmById });
}

function drawMap({ venue, hotel, route, lmById }) {
  const map = document.getElementById("map");
  const coords = route.geometry;
  const dest = [venue.coordinates.lng, venue.coordinates.lat];
  const { z, x0, y0 } = frame([...coords, dest]);
  const P = (c) => { const [x, y] = project(c, z); return [x - x0, y - y0]; };

  // tiles
  let tiles = "";
  for (let tx = Math.floor(x0 / TILE); tx <= Math.floor((x0 + MAP_W) / TILE); tx++)
    for (let ty = Math.floor(y0 / TILE); ty <= Math.floor((y0 + MAP_H) / TILE); ty++)
      tiles += `<img alt="" src="https://tile.openstreetmap.org/${z}/${tx}/${ty}.png" style="left:${tx * TILE - x0}px;top:${ty * TILE - y0}px">`;

  const cum = cumulative(coords);
  const route2d = coords.map(P);
  const pts = route2d.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
  const poly = (l, cls) => `<polygon class="${cls}" points="${l.outline.map(P).map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ")}"/>`;
  const passed = route.landmarks.map((p) => lmById[p.landmarkId]).filter(Boolean);
  const destLm = Object.values(lmById).find((l) => route.landmarks.every((p) => p.landmarkId !== l.id) && l.outline && insideRing(dest, l.outline));

  const n = route.steps.length;
  const badges = route.steps.slice(1, -1).map((s, i) => {
    const [x, y] = P(pointAt(coords, cum, s.startMeters + 4));
    return { x, y, html: `<g class="badge" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><circle r="9.5"/><text dy="3.6">${i + 2}</text></g>` };
  });
  const [sx, sy] = route2d[0], [ex, ey] = route2d[route2d.length - 1];

  // labels: start, destination, then up to 4 landmarks (closest to the route first)
  const labels = [
    { kind: "tag", html: `<b>Start · ${esc(hotel.name.replace(/ Atlanta Downtown$/, ""))}</b>${esc(hotel.address.street)}`, ax: sx, ay: sy, w: 150, h: 34 },
    { kind: "tag", html: `<b>${esc(venue.name)}</b>Arrive here`, ax: ex, ay: ey, w: Math.max(110, venue.name.length * 6.4 + 20), h: 34 },
  ];
  const calloutLms = [...route.landmarks].sort((a, b) => a.metersFromRoute - b.metersFromRoute).slice(0, 4).map((p) => lmById[p.landmarkId]).filter(Boolean);
  for (const l of calloutLms) {
    const c = l.outline.map(P); const ax = c.reduce((s, p) => s + p[0], 0) / c.length, ay = c.reduce((s, p) => s + p[1], 0) / c.length;
    labels.push({ kind: "callout", lm: l, ax, ay, w: 172, h: 38, html: `<svg viewBox="0 0 24 24">${ICONS[l.kind === "park" ? "park" : "building"]}</svg><div><b>${esc(l.name)}</b>${esc(l.line)}</div>` });
  }
  const obstacles = [
    ...route2d.filter((_, i) => i % 1 === 0).map(([x, y]) => ({ x: x - 7, y: y - 7, w: 14, h: 14, weight: 3 })),
    ...badges.map((b) => ({ x: b.x - 12, y: b.y - 12, w: 24, h: 24, weight: 6 })),
    { x: sx - 13, y: sy - 13, w: 26, h: 26, weight: 6 }, { x: ex - 13, y: ey - 13, w: 26, h: 26, weight: 6 },
    { x: 0, y: MAP_H - 36, w: 260, h: 36, weight: 4 }, { x: MAP_W - 200, y: MAP_H - 22, w: 200, h: 22, weight: 4 },
  ];
  placeLabels(labels, obstacles);

  const leaders = labels.filter((l) => l.kind === "callout").map((l) => {
    const b = l.box, tx = Math.min(Math.max(l.ax, b.x), b.x + b.w), ty = Math.min(Math.max(l.ay, b.y), b.y + b.h);
    const color = l.lm.kind === "park" ? "#5f7f68" : "#9b7a3c";
    return `<line x1="${tx.toFixed(1)}" y1="${ty.toFixed(1)}" x2="${l.ax.toFixed(1)}" y2="${l.ay.toFixed(1)}" stroke="${color}" stroke-width="1.1" opacity=".85"/><circle cx="${l.ax.toFixed(1)}" cy="${l.ay.toFixed(1)}" r="2.8" fill="${color}" stroke="#fff" stroke-width="1.2"/>`;
  }).join("");

  map.innerHTML = `<div class="tiles">${tiles}</div>
  <svg viewBox="0 0 ${MAP_W} ${MAP_H}" aria-hidden="true">
    ${destLm ? poly(destLm, "dest") : ""}
    ${passed.map((l) => poly(l, l.kind === "park" ? "passed park" : "passed")).join("")}
    ${leaders}
    <polyline class="route-casing" points="${pts}"/><polyline class="route" points="${pts}"/>
    ${badges.map((b) => b.html).join("")}
    <g class="pin" transform="translate(${sx.toFixed(1)},${sy.toFixed(1)})"><circle r="11" fill="#1d2528"/><text dy="3.5">1</text></g>
    <g class="pin" transform="translate(${ex.toFixed(1)},${ey.toFixed(1)})"><circle r="11" fill="#9b7a3c"/><text dy="3.5">${n}</text></g>
  </svg>
  ${labels.map((l) => `<div class="label ${l.kind === "callout" ? `callout ${l.lm.kind === "park" ? "park" : ""}` : ""}" style="left:${l.box.x.toFixed(1)}px;top:${l.box.y.toFixed(1)}px;${l.kind === "callout" ? "" : `min-width:${l.w}px`}">${l.html}</div>`).join("")}
  <div class="legend"><span><i class="lg-route"></i>Walking route</span><span><i class="lg-badge"></i>Step</span>${passed.length ? '<span><i class="lg-pass"></i>You pass</span>' : ""}</div>
  <div class="attrib">Map data © OpenStreetMap contributors</div>`;

  const wrap = document.getElementById("mapWrap");
  const fit = () => { map.style.transform = `scale(${wrap.clientWidth / MAP_W})`; };
  fit(); new ResizeObserver(fit).observe(wrap);
}

function insideRing(p, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [x1, y1] = ring[j], [x2, y2] = ring[i];
    if (y1 > p[1] !== y2 > p[1] && p[0] < ((x2 - x1) * (p[1] - y1)) / (y2 - y1) + x1) inside = !inside;
  }
  return inside;
}

document.getElementById("print").addEventListener("click", () => window.print());

(async () => {
  if (!id || !/^[a-z0-9-]+$/.test(id)) return showMessage('No venue selected. <a href="./">Back to the guide</a>');
  try {
    const [venuesDoc, hotel, landmarksDoc] = await Promise.all([getJson("data/venues.json"), getJson("data/hotel.json"), getJson("data/landmarks.json")]);
    const venue = venuesDoc.venues.find((v) => v.id === id);
    if (!venue) return showMessage('That venue isn’t in the guide. <a href="./">Back to the guide</a>');
    const live = setLiveLink(hotelAddress(hotel), venue.address);
    let route;
    try { route = await getJson(`data/routes/${id}.json`); }
    catch (err) {
      if (err.status === 404) return showMessage(`Walking directions for <strong>${esc(venue.name)}</strong> haven’t been generated yet. Use “Open in ${live.app}” above for live directions.`);
      throw err;
    }
    render({ venue, hotel, route, landmarks: landmarksDoc.landmarks });
    if (params.get("print") === "1") {
      const imgs = [...document.querySelectorAll(".tiles img")];
      await Promise.race([Promise.all(imgs.map((i) => (i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; })))), new Promise((r) => setTimeout(r, 4000))]);
      window.print();
    }
  } catch (err) {
    console.error("Walking card failed to load:", err);
    showMessage('The walking directions could not be loaded. Please refresh, or use the live map link above.');
  }
})();
</script>
</body>
</html>
